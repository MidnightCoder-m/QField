<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0" />
    <title>QField</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><g transform='translate(-3.25 1.63) matrix(1.2279158 0 0 1.2279158 -55.03 -60.03)' fill='%2380cc28'><polygon points='362.43,244.34 339.1,339.97 243.47,363.3 422.09,422.97'/><path d='m 255.96,393.69 c -36.77,0 -71.33,-14.32 -97.33,-40.31 -26,-26 -40.31,-60.56 -40.31,-97.33 0,-36.77 14.32,-71.33 40.31,-97.33 26,-26 60.56,-40.31 97.33,-40.31 36.77,0 71.33,14.32 97.33,40.31 26,26 40.31,60.56 40.31,97.33 0,7.78 -0.65,15.46 -1.91,22.99 l 26.56,79.53 C 437.03,328.91 447.9,293.75 447.9,256.05 447.9,150.04 361.96,64.09 255.94,64.09 149.92,64.09 64,150.03 64,256.04 64,362.05 149.94,448 255.96,448 c 37.83,0 73.1,-10.95 102.83,-29.84 l -79.24,-26.47 c -7.72,1.32 -15.61,2 -23.59,2 z'/></g></svg>" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }
      #screen {
        position: absolute;
        inset: 0;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 16px system-ui, sans-serif;
        color: #80cc28;
        background: #ffffff;
      }
      #overlay.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <div id="overlay">Loading QField…</div>

    <script src="@QFIELD_WASM_TARGET@.js"></script>
    <script src="qtloader.js"></script>
    <script type="text/javascript">
      (async () => {
        const container = document.querySelector("#screen");
        const overlay = document.querySelector("#overlay");

        await new Promise(resolve => {
          const check = () => {
            const rect = container.getBoundingClientRect();
            if (rect.width > 0 && rect.height > 0) {
              resolve();
            } else {
              requestAnimationFrame(check);
            }
          };
          check();
        });

        const project = new URLSearchParams(window.location.search).get("project");

        try {
          await qtLoad({
            arguments: project ? [project] : [],
            qt: {
              onLoaded: () => overlay.classList.add("hidden"),
              onExit: exitData => {
                overlay.classList.remove("hidden");
                overlay.textContent = `QField exited: ${exitData.code ?? ""} ${exitData.text ?? ""}`;
              },
              entryFunction: window.@QFIELD_WASM_TARGET@_entry,
              containerElements: [container]
            }
          });
        } catch (e) {
          console.error("[qfield] qtLoad failed:", e, e.stack);
        }
      })();
    </script>
  </body>
</html>
